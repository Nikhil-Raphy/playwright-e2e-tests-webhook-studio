name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.24"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pylint src tests
      - run: uv run mypy src tests
      - name: Build the docs
        run: uv run --locked --only-group docs zensical build --clean --strict

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest tests/unit

  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Chromium run also holds the unit tests, so its coverage spans the whole package.
          - browser: chromium
            tests: tests --cov --cov-report=term-missing
          - browser: firefox
            tests: tests/e2e
          - browser: webkit
            tests: tests/e2e
    env:
      APP_DIR: app
      POSTGRES_PASSWORD: ci-only-not-secret
      BROWSER: ${{ matrix.browser }}
      TESTS: ${{ matrix.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Nikhil-Raphy/reflex-fastapi-webhook-studio
          ref: main
          path: app
          persist-credentials: false
      - name: Build the stack
        run: docker compose build
      - name: Run the tests
        run: >-
          E2E_UID="$(id -u)" E2E_GID="$(id -g)"
          docker compose run --rm tests pytest $TESTS --browser "$BROWSER" --reruns 1
          --junitxml="reports/junit-$BROWSER.xml" --html="reports/report-$BROWSER.html" --self-contained-html
          --alluredir=allure-results
      - name: Show the stack's logs
        if: failure()
        run: docker compose logs app app-local echo
      - name: Keep the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.browser }}
          path: reports/
          retention-days: 14
      - name: Keep the Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          retention-days: 14
      - name: Keep traces, videos and screenshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 14
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv export --locked --all-groups --no-emit-project -o requirements-audit.txt
      - run: uvx pip-audit@2.10.1 -r requirements-audit.txt --require-hashes --disable-pip --progress-spinner off
      - run: >-
          uvx pip-audit@2.10.1 -r requirements-audit.txt --require-hashes --disable-pip --progress-spinner off
          --vulnerability-service osv
      - run: uv audit --locked
      - run: uvx zizmor@1.31.1 --offline .github/

  publish:
    name: publish
    # Publish the report even when tests fail: that is when it matters most.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repo
      pages: write # publish the site to GitHub Pages
      id-token: write # prove to Pages that this run is who it says
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
      - name: Fetch the report history from the live site
        run: curl --fail --silent --location "$SITE/report/history.jsonl" --output history.jsonl || true
        env:
          SITE: ${{ steps.pages.outputs.base_url }}
      - run: uv run --locked --only-group docs zensical build --clean --strict
      - name: Build the Allure report
        run: npx --yes allure@3.22.1 generate allure-results --config allurerc.json --output site/report
      - run: cp history.jsonl site/report/history.jsonl
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
