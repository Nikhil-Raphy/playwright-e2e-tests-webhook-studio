version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # The playwright package must move with the Playwright image in docker/runner.Dockerfile.
    ignore:
      - dependency-name: playwright
    commit-message:
      prefix: build
      include: scope
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker
    # A new Playwright image needs the same `playwright` version in pyproject.toml, in the same pull request.
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      docker:
        patterns: ["*"]
